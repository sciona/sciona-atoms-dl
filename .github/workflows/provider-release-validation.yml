name: provider-release-validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-provider-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out provider
        uses: actions/checkout@v4

      - name: Check out release contract
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sciona-matcher
          path: .sciona-matcher

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: python -m pip install --upgrade "setuptools>=69" wheel

      - name: Validate provider wheel
        env:
          PYTHONPATH: .sciona-matcher
        run: python -m sciona.provider_release .

