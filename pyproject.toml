[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sciona-atoms-dl"
version = "0.1.0"
description = "Deep learning provider repo for sciona.atoms.* namespace packages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "scikit-image",
  "sciona",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
contrails = [
  "torch==2.11.0",
  "torchvision==0.26.0",
  "timm==0.9.2",
  "segmentation-models-pytorch==0.3.3",
  "albumentations==1.3.0",
  "qudida==0.0.4",
  "opencv-python-headless==5.0.0.93",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
